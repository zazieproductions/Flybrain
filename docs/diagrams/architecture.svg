<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="'JetBrains Mono', 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a101d"/><stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#00f0ff"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#00ff88"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#ff2a55"/>
    </marker>
  </defs>
  <rect width="1240" height="660" fill="url(#bg)"/>
  <text x="620" y="36" text-anchor="middle" fill="#f1f7ff" font-size="21" font-weight="bold" letter-spacing="3">FLYBRAIN · SYSTEM ARCHITECTURE</text>
  <text x="620" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">OPTOGEN-V3 · zero-build ES modules · Three.js r160 · WebGL</text>

  <!-- INPUT LAYER -->
  <rect x="40" y="90" width="330" height="150" rx="12" fill="#10192a" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="205" y="116" text-anchor="middle" fill="#00f0ff" font-size="13" font-weight="bold">◈ INPUT LAYER</text>
  <text x="205" y="140" text-anchor="middle" fill="#f1f7ff" font-size="12">videoProcessor.js</text>
  <text x="205" y="160" text-anchor="middle" fill="#94a3b8" font-size="11">6 procedural channels · webcam</text>
  <text x="205" y="178" text-anchor="middle" fill="#94a3b8" font-size="11">video / image / audio / text upload</text>
  <text x="205" y="202" text-anchor="middle" fill="#00ff88" font-size="11">→ 160 × 120 retinotopic matrix</text>
  <text x="205" y="222" text-anchor="middle" fill="#00ff88" font-size="11">→ seizureIndex ∈ [0,1] · luminance · Δframe</text>

  <!-- CORE LOOP -->
  <rect x="455" y="90" width="330" height="150" rx="12" fill="#10192a" stroke="#a855f7" stroke-width="1.5"/>
  <text x="620" y="116" text-anchor="middle" fill="#a855f7" font-size="13" font-weight="bold">◈ ORCHESTRATION CORE</text>
  <text x="620" y="140" text-anchor="middle" fill="#f1f7ff" font-size="12">app.js · requestAnimationFrame</text>
  <text x="620" y="160" text-anchor="middle" fill="#94a3b8" font-size="11">60 Hz frame loop · dt-clamped</text>
  <text x="620" y="178" text-anchor="middle" fill="#94a3b8" font-size="11">GABA / PTX / opto-shock · keyboard</text>
  <text x="620" y="202" text-anchor="middle" fill="#94a3b8" font-size="11">drag &amp; drop uplink · PiP monitor</text>
  <text x="620" y="222" text-anchor="middle" fill="#94a3b8" font-size="11">scrubber · speed · channel presets</text>

  <!-- RENDER LAYER -->
  <rect x="870" y="90" width="330" height="150" rx="12" fill="#10192a" stroke="#00ff88" stroke-width="1.5"/>
  <text x="1035" y="116" text-anchor="middle" fill="#00ff88" font-size="13" font-weight="bold">◈ RENDER LAYER</text>
  <text x="1035" y="140" text-anchor="middle" fill="#f1f7ff" font-size="12">brainRenderer.js · flyModel.js</text>
  <text x="1035" y="160" text-anchor="middle" fill="#94a3b8" font-size="11">6,800-neuron THREE.Points cloud</text>
  <text x="1035" y="178" text-anchor="middle" fill="#94a3b8" font-size="11">768-dot optogenetic matrix</text>
  <text x="1035" y="196" text-anchor="middle" fill="#94a3b8" font-size="11">4,800 synaptic segments · 350 axon pulses</text>
  <text x="1035" y="222" text-anchor="middle" fill="#00ff88" font-size="11">additive blending · ACES tone mapping</text>

  <path d="M370 165 L450 165" stroke="#00f0ff" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M785 165 L865 165" stroke="#00f0ff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- TELEMETRY -->
  <rect x="40" y="300" width="330" height="130" rx="12" fill="#10192a" stroke="#ffaa00" stroke-width="1.5"/>
  <text x="205" y="326" text-anchor="middle" fill="#ffaa00" font-size="13" font-weight="bold">◈ TELEMETRY</text>
  <text x="205" y="350" text-anchor="middle" fill="#f1f7ff" font-size="12">telemetry.js</text>
  <text x="205" y="370" text-anchor="middle" fill="#94a3b8" font-size="11">5-channel EEG / LFP oscilloscope</text>
  <text x="205" y="388" text-anchor="middle" fill="#94a3b8" font-size="11">spike-rate Hz · ictal probability</text>
  <text x="205" y="410" text-anchor="middle" fill="#94a3b8" font-size="11">wing Hz · leg tremor · synapse storm</text>

  <!-- LOCOMOTION -->
  <rect x="455" y="300" width="330" height="130" rx="12" fill="#10192a" stroke="#ff007f" stroke-width="1.5"/>
  <text x="620" y="326" text-anchor="middle" fill="#ff007f" font-size="13" font-weight="bold">◈ LOCOMOTION</text>
  <text x="620" y="350" text-anchor="middle" fill="#f1f7ff" font-size="12">flyModel.js · walking arena</text>
  <text x="620" y="370" text-anchor="middle" fill="#94a3b8" font-size="11">alternating tripod gait · 6 legs</text>
  <text x="620" y="388" text-anchor="middle" fill="#94a3b8" font-size="11">roam / manual WASD / click-to-walk</text>
  <text x="620" y="410" text-anchor="middle" fill="#94a3b8" font-size="11">seizure jitter · brain X-ray hologram</text>

  <!-- SONIFICATION -->
  <rect x="870" y="300" width="330" height="130" rx="12" fill="#10192a" stroke="#ffd700" stroke-width="1.5"/>
  <text x="1035" y="326" text-anchor="middle" fill="#ffd700" font-size="13" font-weight="bold">◈ SONIFICATION</text>
  <text x="1035" y="350" text-anchor="middle" fill="#f1f7ff" font-size="12">audioEngine.js · 7 SFX</text>
  <text x="1035" y="370" text-anchor="middle" fill="#94a3b8" font-size="11">fly buzz scales with excitation</text>
  <text x="1035" y="388" text-anchor="middle" fill="#94a3b8" font-size="11">zap · alarm · inject · uplink</text>
  <text x="1035" y="410" text-anchor="middle" fill="#94a3b8" font-size="11">click · walk steps · master gain</text>

  <path d="M620 240 L620 295" stroke="#00ff88" stroke-width="2" marker-end="url(#arrG)"/>
  <path d="M620 240 L205 295" stroke="#ffaa00" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <path d="M620 240 L1035 295" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- FEEDBACK -->
  <rect x="40" y="480" width="1160" height="64" rx="12" fill="#0a101d" stroke="#ff2a55" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="620" y="506" text-anchor="middle" fill="#ff2a55" font-size="13" font-weight="bold">↺ CLOSED LOOP — SEIZURE FEEDBACK</text>
  <text x="620" y="530" text-anchor="middle" fill="#94a3b8" font-size="12">seizureIndex drives neuron storm · fly convulsions · EEG spikes · buzz/alarm audio · banner state — every subsystem reacts to the same scalar, every frame</text>
  <path d="M205 430 L205 475" stroke="#ff2a55" stroke-width="1.5" marker-end="url(#arrR)"/>
  <path d="M620 430 L620 475" stroke="#ff2a55" stroke-width="1.5" marker-end="url(#arrR)"/>
  <path d="M1035 430 L1035 475" stroke="#ff2a55" stroke-width="1.5" marker-end="url(#arrR)"/>

  <text x="620" y="580" text-anchor="middle" fill="#576b84" font-size="11">no build step · no backend · no dependencies beyond Three.js (CDN import map) · runs from any static host</text>
  <text x="620" y="604" text-anchor="middle" fill="#576b84" font-size="11">color code — cyan: input · purple: core · green: render · amber: telemetry · magenta: locomotion · gold: audio · red: feedback</text>
</svg>
