<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" font-family="'JetBrains Mono', 'Courier New', monospace">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a101d"/><stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#00ff88"/>
    </marker>
    <marker id="a4a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#ffaa00"/>
    </marker>
    <marker id="a4r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#ff2a55"/>
    </marker>
  </defs>
  <rect width="1240" height="470" fill="url(#bg4)"/>
  <text x="620" y="36" text-anchor="middle" fill="#f1f7ff" font-size="21" font-weight="bold" letter-spacing="3">SEIZURE STATE MACHINE</text>
  <text x="620" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">one scalar, three regimes — every subsystem switches together</text>

  <!-- states -->
  <g>
    <rect x="40" y="120" width="280" height="170" rx="14" fill="#10192a" stroke="#00ff88" stroke-width="2"/>
    <text x="180" y="150" text-anchor="middle" fill="#00ff88" font-size="14" font-weight="bold">STEADY EQUILIBRIUM</text>
    <text x="180" y="176" text-anchor="middle" fill="#f1f7ff" font-size="13">index &lt; 0.30</text>
    <text x="180" y="202" text-anchor="middle" fill="#94a3b8" font-size="11.5">banner: green · risk LOW</text>
    <text x="180" y="222" text-anchor="middle" fill="#94a3b8" font-size="11.5">spike rate ~15–60 Hz</text>
    <text x="180" y="242" text-anchor="middle" fill="#94a3b8" font-size="11.5">tripod gait · calm EEG</text>
    <text x="180" y="268" text-anchor="middle" fill="#00ff88" font-size="11">optomotor · calcium · uploads</text>
  </g>
  <g>
    <rect x="480" y="120" width="280" height="170" rx="14" fill="#10192a" stroke="#ffaa00" stroke-width="2"/>
    <text x="620" y="150" text-anchor="middle" fill="#ffaa00" font-size="14" font-weight="bold">HYPER-SYNCHRONOUS BURST</text>
    <text x="620" y="176" text-anchor="middle" fill="#f1f7ff" font-size="13">0.30 ≤ index ≤ 0.60</text>
    <text x="620" y="202" text-anchor="middle" fill="#94a3b8" font-size="11.5">banner: amber · risk ELEVATED</text>
    <text x="620" y="222" text-anchor="middle" fill="#94a3b8" font-size="11.5">myoclonic twitching · spasms</text>
    <text x="620" y="242" text-anchor="middle" fill="#94a3b8" font-size="11.5">wing flutter · EEG spikes grow</text>
    <text x="620" y="268" text-anchor="middle" fill="#ffaa00" font-size="11">avalanche · techno · fast cuts</text>
  </g>
  <g>
    <rect x="920" y="120" width="280" height="170" rx="14" fill="#10192a" stroke="#ff2a55" stroke-width="2"/>
    <text x="1060" y="150" text-anchor="middle" fill="#ff2a55" font-size="14" font-weight="bold">ICTAL CONVULSION</text>
    <text x="1060" y="176" text-anchor="middle" fill="#f1f7ff" font-size="13">index &gt; 0.60</text>
    <text x="1060" y="202" text-anchor="middle" fill="#94a3b8" font-size="11.5">banner: red · risk CRITICAL</text>
    <text x="1060" y="222" text-anchor="middle" fill="#94a3b8" font-size="11.5">tonic-clonic · 300+ Hz spikes</text>
    <text x="1060" y="242" text-anchor="middle" fill="#94a3b8" font-size="11.5">full EEG spike trains · alarm</text>
    <text x="1060" y="268" text-anchor="middle" fill="#ff2a55" font-size="11">hyper-strobe · PTX overdrive</text>
  </g>

  <path d="M320 205 L475 205" stroke="#00ff88" stroke-width="2.5" marker-end="url(#a4)"/>
  <text x="397" y="192" text-anchor="middle" fill="#94a3b8" font-size="11">flicker ↑</text>
  <path d="M760 205 L915 205" stroke="#ffaa00" stroke-width="2.5" marker-end="url(#a4a)"/>
  <text x="837" y="192" text-anchor="middle" fill="#94a3b8" font-size="11">flicker ↑↑</text>

  <!-- rescue -->
  <rect x="480" y="340" width="280" height="80" rx="12" fill="#0a101d" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="620" y="368" text-anchor="middle" fill="#00f0ff" font-size="13" font-weight="bold">💉 GABA RESCUE (G)</text>
  <text x="620" y="392" text-anchor="middle" fill="#94a3b8" font-size="11.5">sensitivity → 0.2 · 5 s · PTX off</text>
  <path d="M1060 290 L1060 380 L765 380" stroke="#00f0ff" stroke-width="2" fill="none" marker-end="url(#a4)"/>
  <path d="M620 340 L620 295" stroke="#00f0ff" stroke-width="2" marker-end="url(#a4)"/>
  <text x="880" y="372" fill="#00f0ff" font-size="11">anticonvulsant</text>

  <!-- triggers -->
  <text x="620" y="452" text-anchor="middle" fill="#576b84" font-size="11.5">triggers — 🧪 PTX (P): GABA-blocker ×2.2 · ⚡ opto shock (Z): 470 nm laser · 💉 GABA (G): 5 s suppression · 📁 any file: drag &amp; drop uplink</text>
</svg>
